[workspace]
resolver = "2"
members = [
    "crates/bsr-core",
    "crates/bsr-capture",
    "crates/bsr-encode",
    "crates/bsr-ipc",
    "crates/bsr-ui",
    "crates/bsr-hrt",
    "crates/bsr-mux",
    "crates/bsr-smoke",
    "crates/bsr-tests",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[workspace.metadata.fullwrapper]
satellite = true
app_code = "BSR"

