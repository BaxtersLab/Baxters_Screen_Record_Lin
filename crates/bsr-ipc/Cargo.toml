[package]
name = "bsr-ipc"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[dependencies]
bsr-core = { path = "../bsr-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
once_cell = "1"
# Seed-BSR-G3-02-11: SHA-256 for redaction audit log hashing.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
