[package]
name = "bsr-mux"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
# default-features disabled to drop avdevice (`device`) + avfilter (`filter`), which
# BSR never uses; keeps the bundle from dragging in the 119 MB avfilter DLL.
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
bsr-ipc = { path = "../bsr-ipc" }

[dev-dependencies]
tempfile = "3.0"
bsr-encode = { path = "../bsr-encode" }
bsr-capture = { path = "../bsr-capture" }